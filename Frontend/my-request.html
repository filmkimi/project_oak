<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำขอยืมของฉัน - ระบบยืม-คืนอุปกรณ์</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Kanit', sans-serif; background-color: #f8f9fa; }
        .brand-bg-dark { background-color: #7a0c1e; }
        .request-table thead { background-color: #7a0c1e; }
        .request-table thead th { color: #fff; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">

    <!-- Navbar สีแดงเข้มตามหน้าแรก -->
    <nav class="brand-bg-dark shadow-md sticky top-0 z-45">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3.5 no-underline">
                <div class="w-11 h-11 bg-white rounded-xl text-[#7a0c1e] flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-boxes-packing text-lg"></i>
                </div>
                <div>
                    <span class="block font-bold text-lg text-white leading-tight">Borrow System</span>
                    <span class="block text-xs text-rose-200 font-light">ระบบยืม-คืนอุปกรณ์</span>
                </div>
            </a>
            <ul class="flex items-center gap-8 m-0 p-0 list-none">
                <li>
                    <a href="index.html" class="text-rose-100 hover:text-white font-medium text-sm flex items-center gap-2 transition">
                        <i class="fa-solid fa-list"></i> รายการอุปกรณ์
                    </a>
                </li>
                <li>
                    <a href="my-request.html" class="text-white font-semibold text-sm flex items-center gap-2 transition">
                        <i class="fa-solid fa-clock-rotate-left"></i> คำขอยืมของฉัน
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-2.5">
                <i class="fa-solid fa-clock-rotate-left text-[#7a0c1e]"></i> ประวัติและรายการคำขอยืมของฉัน
            </h2>
            <p class="text-sm text-gray-500 mt-1">ตรวจสอบสถานะ วันเวลา และรายชื่อผู้ยืมอุปกรณ์ของคุณได้ที่นี่</p>
        </div>

        <!-- ตารางแสดงรายการยืม -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="request-table min-w-full divide-y divide-gray-200">
                    <thead>
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">โปรเจกต์ / วัตถุประสงค์</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">รายชื่อผู้ยืม</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">รายการอุปกรณ์ที่ยืม</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">วันที่ยืม - กำหนดคืน</th>
                            <th class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="my-requests-tbody" class="bg-white divide-y divide-gray-100">
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-gray-400">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

<!-- Socket.IO สำหรับ Real-time -->
<script src="http://localhost:3000/socket.io/socket.io.js"></script>

<script>
    const API_BASE_URL = 'http://localhost:3000/api';

    // ==========================================
    // Socket.IO Real-time
    // ==========================================
    const requestSocket = io("http://localhost:3000");

    // เมื่อเปิดหน้า ให้โหลดข้อมูลทันที
    document.addEventListener('DOMContentLoaded', () => {
        loadMyRequests();

        // ตรวจสอบข้อมูลทุก 2 วินาที
        // เพื่อให้สถานะเปลี่ยนโดยไม่ต้องกด Refresh
        setInterval(() => {
            loadMyRequests(true);
        }, 2000);
    });


    // ==========================================
    // โหลดคำขอยืมของผู้ใช้ปัจจุบัน
    // ==========================================
    async function loadMyRequests(isRealtime = false) {

        const tbody = document.getElementById('my-requests-tbody');

        if (!tbody) return;


        // ------------------------------------------
        // ดึง User ที่ Login อยู่
        // ------------------------------------------
        const savedUser = JSON.parse(
            localStorage.getItem('currentUser') || '{}'
        );

        const token = localStorage.getItem('token');

        const currentUserId =
            savedUser?.id ||
            savedUser?._id;


        // ------------------------------------------
        // ยังไม่ได้ Login
        // ------------------------------------------
        if (!currentUserId) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5"
                        class="px-6 py-12 text-center text-gray-400">

                        <i class="fa-solid fa-user-lock text-3xl mb-3 block"></i>

                        กรุณาเข้าสู่ระบบเพื่อดูคำขอยืมของคุณ

                    </td>
                </tr>
            `;

            return;
        }


        try {

            // ------------------------------------------
            // Authorization
            // ------------------------------------------
            const headers = {};

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }


            // ------------------------------------------
            // GET คำขอยืมจาก Backend
            // ------------------------------------------
            const res = await fetch(
                `${API_BASE_URL}/borrows/mine`,
                {
                    headers: headers
                }
            );


            const responseText = await res.text();
            let result;
            try {
                result = responseText ? JSON.parse(responseText) : null;
            } catch {
                if (res.status === 404) {
                    throw new Error('ไม่พบ API /borrows/mine (HTTP 404) กรุณารีสตาร์ต backend ด้วยคำสั่ง node server.js ในโฟลเดอร์ backend');
                }
                throw new Error(`Backend ตอบกลับข้อมูลที่ไม่ใช่ JSON (HTTP ${res.status})`);
            }


            if (!res.ok) {

                throw new Error(
                    result.message ||
                    result.error ||
                    'ไม่สามารถโหลดข้อมูลคำขอยืมได้'
                );

            }


            // รองรับทั้ง
            // [ ... ]
            // และ
            // { data: [ ... ] }

            const allBorrows =
                Array.isArray(result)
                    ? result
                    : (result.data || []);


            // ==========================================
            // กรองเฉพาะคำขอของ User ที่ Login
            // ==========================================

            const myBorrows = allBorrows.filter(borrow => {

                const borrowUserId =
                    borrow.user?._id ||
                    borrow.user?.id ||

                    borrow.user_id?._id ||
                    borrow.user_id?.id ||

                    borrow.user_id ||

                    (
                        typeof borrow.user === 'string'
                            ? borrow.user
                            : null
                    );


                return String(borrowUserId)
                    === String(currentUserId);

            });


            // ==========================================
            // ไม่มีคำขอยืม
            // ==========================================

            if (myBorrows.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5"
                            class="px-6 py-12 text-center text-gray-400">

                            <i class="fa-solid fa-box-open text-3xl mb-3 block"></i>

                            ยังไม่มีคำขอยืมอุปกรณ์

                        </td>
                    </tr>
                `;

                return;
            }


            // ==========================================
            // แสดงข้อมูล
            // ==========================================

            tbody.innerHTML = '';


            myBorrows.forEach(borrow => {

                // --------------------------------------
                // User
                // --------------------------------------

                const user =
                    borrow.user || savedUser;


                // --------------------------------------
                // รายการอุปกรณ์
                // --------------------------------------

                let itemsHtml =
                    (borrow.items || [])
                        .map(i => {

                            const itemName =
                                i.item?.name ||
                                i.item?.item_name ||
                                'อุปกรณ์';


                            return `
                                <div class="text-sm text-gray-700 py-0.5">

                                    • ${itemName}

                                    <span class="text-gray-400 font-medium">
                                        (x${i.requested_qty})
                                    </span>

                                </div>
                            `;

                        })
                        .join('');


                if (!itemsHtml) {

                    itemsHtml = `
                        <span class="text-gray-400">
                            ไม่พบรายการอุปกรณ์
                        </span>
                    `;

                }


                // ======================================
                // สถานะ
                // ======================================

                let statusBadge = '';


                // รออนุมัติ
                if (
                    borrow.status === 'pending' ||
                    borrow.status === 'Pending'
                ) {

                    statusBadge = `
                        <span
                            class="inline-flex items-center gap-1.5
                                   bg-amber-50
                                   text-amber-700
                                   border border-amber-200
                                   px-3 py-1.5
                                   rounded-full
                                   text-xs
                                   font-medium">

                            <i class="fa-solid fa-clock"></i>

                            รออนุมัติ

                        </span>
                    `;

                }


                // อนุมัติ
                else if (
                    borrow.status === 'approved' ||
                    borrow.status === 'Approved'
                ) {

                    statusBadge = `
                        <span
                            class="inline-flex items-center gap-1.5
                                   bg-emerald-50
                                   text-emerald-700
                                   border border-emerald-200
                                   px-3 py-1.5
                                   rounded-full
                                   text-xs
                                   font-medium">

                            <i class="fa-solid fa-circle-check"></i>

                            อนุมัติ

                        </span>
                    `;

                }


                // ไม่อนุมัติ
                else if (
                    borrow.status === 'rejected' ||
                    borrow.status === 'Rejected'
                ) {

                    statusBadge = `
                        <span
                            class="inline-flex items-center gap-1.5
                                   bg-red-50
                                   text-red-700
                                   border border-red-200
                                   px-3 py-1.5
                                   rounded-full
                                   text-xs
                                   font-medium">

                            <i class="fa-solid fa-circle-xmark"></i>

                            ไม่อนุมัติ

                        </span>
                    `;

                }


                // สถานะอื่น
                else {

                    statusBadge = `
                        <span
                            class="inline-flex items-center gap-1.5
                                   bg-gray-50
                                   text-gray-700
                                   border border-gray-200
                                   px-3 py-1.5
                                   rounded-full
                                   text-xs
                                   font-medium">

                            ${borrow.status || '-'}

                        </span>
                    `;

                }


                // ======================================
                // วันที่
                // ======================================

                const borrowDate =
                    borrow.borrow_date
                        ? new Date(
                            borrow.borrow_date
                        ).toLocaleDateString(
                            'th-TH',
                            {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            }
                        )
                        : '-';


                const dueDate =
                    borrow.due_date
                        ? new Date(
                            borrow.due_date
                        ).toLocaleDateString(
                            'th-TH',
                            {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            }
                        )
                        : '-';


                const createdAt =
                    borrow.createdAt
                        ? new Date(
                            borrow.createdAt
                        ).toLocaleString(
                            'th-TH',
                            {
                                dateStyle: 'short',
                                timeStyle: 'short'
                            }
                        )
                        : '';


                // ======================================
                // สร้าง Row
                // ======================================

                tbody.innerHTML += `

                    <tr
                        class="hover:bg-rose-50/50
                               transition">

                        <!-- Project -->

                        <td class="px-6 py-4">

                            <div
                                class="font-semibold
                                       text-gray-900">

                                ${borrow.project_name || '-'}

                            </div>


                            <div
                                class="text-xs
                                       text-gray-500
                                       mt-0.5">

                                วัตถุประสงค์:
                                ${borrow.purpose || '-'}

                            </div>


                            ${
                                createdAt
                                    ? `
                                        <div
                                            class="text-[11px]
                                                   text-gray-400
                                                   mt-1">

                                            <i
                                                class="fa-regular
                                                       fa-clock">
                                            </i>

                                            ทำรายการเมื่อ:
                                            ${createdAt}

                                        </div>
                                    `
                                    : ''
                            }

                        </td>


                        <!-- User -->

                        <td
                            class="px-6 py-4
                                   whitespace-nowrap">

                            <div
                                class="font-medium
                                       text-gray-900">

                                ${
                                    user.full_name ||
                                    savedUser.full_name ||
                                    '-'
                                }

                            </div>


                            <div
                                class="text-xs
                                       text-gray-500">

                                รหัส:

                                ${
                                    user.identifier_code ||
                                    savedUser.identifier_code ||
                                    '-'
                                }

                            </div>

                        </td>


                        <!-- Items -->

                        <td class="px-6 py-4">

                            ${itemsHtml}

                        </td>


                        <!-- Dates -->

                        <td
                            class="px-6 py-4
                                   whitespace-nowrap
                                   text-xs">

                            <div
                                class="font-medium
                                       text-emerald-700">

                                <i
                                    class="fa-regular
                                           fa-calendar-check">
                                </i>

                                ยืม:
                                ${borrowDate}

                            </div>


                            <div
                                class="mt-1
                                       text-rose-700">

                                <i
                                    class="fa-regular
                                           fa-calendar-xmark">
                                </i>

                                คืน:
                                ${dueDate}

                            </div>

                        </td>


                        <!-- Status -->

                        <td
                            class="px-6 py-4
                                   whitespace-nowrap
                                   text-center">

                            ${statusBadge}

                        </td>

                    </tr>

                `;

            });


        } catch (err) {

            console.error(
                'Error loading my requests:',
                err
            );


            // ถ้าเป็นการ Refresh แบบ Real-time
            // ไม่ต้องลบข้อมูลเดิมออก

            if (isRealtime) {
                return;
            }


            tbody.innerHTML = `
                <tr>

                    <td
                        colspan="5"
                        class="px-6 py-12
                               text-center
                               text-rose-600
                               font-medium">

                        <i
                            class="fa-solid
                                   fa-triangle-exclamation
                                   mr-1">
                        </i>

                        เกิดข้อผิดพลาดในการโหลดข้อมูล

                        <div
                            class="text-xs
                                   text-gray-400
                                   mt-2">

                            ${err.message}

                        </div>

                    </td>

                </tr>
            `;

        }

    }


    // ==========================================
    // Socket.IO Real-time Event
    // ==========================================
    //
    // ถ้า Backend มีการ emit event เหล่านี้
    // จะโหลดข้อมูลใหม่ทันที
    //

    requestSocket.on('borrow_updated', () => {
        loadMyRequests(true);
    });


    requestSocket.on('borrow_status_updated', () => {
        loadMyRequests(true);
    });


    requestSocket.on('borrow_request_updated', () => {
        loadMyRequests(true);
    });


    requestSocket.on('status_updated', () => {
        loadMyRequests(true);
    });


    requestSocket.on('borrows_updated', () => {
        loadMyRequests(true);
    });

</script>
</body>
</html>
