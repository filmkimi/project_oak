<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำขอยืมของฉัน - ระบบยืม-คืนอุปกรณ์</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } 
        /* โทนสีแดงเข้มสไตล์เดียวกับหน้าแรก */
        .brand-bg-dark { background-color: #7a0c1e; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">

    <!-- Navbar สีแดงเข้มตามหน้าแรก -->
    <nav class="brand-bg-dark shadow-md sticky top-0 z-45">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3.5 no-underline">
                <div class="w-11 h-11 bg-white rounded-xl text-[#5c0617] flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-boxes-packing text-lg"></i>
                </div>
                <div>
                    <span class="block font-bold text-lg text-white leading-tight">Borrow System</span>
                    <span class="block text-xs text-rose-200 font-light">ระบบยืม-คืนอุปกรณ์</span>
                </div>
            </a>
            <ul class="flex items-center gap-8 m-0 p-0 list-none">
                <li>
                    <a href="index.html" class="text-rose-100 hover:text-white font-medium text-sm flex items-center gap-2 transition">
                        <i class="fa-solid fa-list"></i> รายการอุปกรณ์
                    </a>
                </li>
                <li>
                    <a href="my-request.html" class="text-white font-semibold text-sm flex items-center gap-2 transition">
                        <i class="fa-solid fa-clock-rotate-left"></i> คำขอยืมของฉัน
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-2.5">
                <i class="fa-solid fa-clock-rotate-left text-[#5c0617]"></i> ประวัติและรายการคำขอยืมของฉัน
            </h2>
            <p class="text-sm text-gray-500 mt-1">ตรวจสอบสถานะ วันเวลา และรายชื่อผู้ยืมอุปกรณ์ของคุณได้ที่นี่</p>
        </div>

        <!-- ตารางแสดงรายการยืม -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">โปรเจกต์ / วัตถุประสงค์</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">รายชื่อผู้ยืม</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">รายการอุปกรณ์ที่ยืม</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">วันที่ยืม - กำหนดคืน</th>
                            <th class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="my-requests-tbody" class="bg-white divide-y divide-gray-100">
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-gray-400">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        document.addEventListener('DOMContentLoaded', () => {
            loadMyRequests();
        });

        async function loadMyRequests() {
            const tbody = document.getElementById('my-requests-tbody');
            
            try {
                const res = await fetch(`${API_BASE_URL}/borrows`);
                const result = await res.json();
                const borrows = Array.isArray(result) ? result : (result.data || []);

                if (borrows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-400 font-light">ยังไม่มีประวัติการยืมอุปกรณ์ในระบบ</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                borrows.forEach(borrow => {
                    const user = borrow.user || { full_name: 'ผู้ใช้งานทั่วไป', identifier_code: '-' };
                    
                    let itemsHtml = (borrow.items || []).map(i => {
                        const itemName = i.item ? i.item.name : 'อุปกรณ์';
                        return `<div class="text-sm text-gray-700 py-0.5">• ${itemName} <span class="text-gray-400 font-medium">(x${i.requested_qty})</span></div>`;
                    }).join('');

                    let statusBadge = '';
                    if (borrow.status === 'pending') statusBadge = '<span class="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full text-xs font-medium">รออนุมัติ</span>';
                    else if (borrow.status === 'approved') statusBadge = '<span class="bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1 rounded-full text-xs font-medium">กำลังยืม</span>';
                    else if (borrow.status === 'returned') statusBadge = '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-medium">คืนแล้ว</span>';
                    else statusBadge = `<span class="bg-gray-50 text-gray-700 border border-gray-200 px-3 py-1 rounded-full text-xs font-medium">${borrow.status}</span>`;

                    const borrowDate = borrow.borrow_date ? new Date(borrow.borrow_date).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';
                    const dueDate = borrow.due_date ? new Date(borrow.due_date).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';
                    const createdAt = borrow.createdAt ? new Date(borrow.createdAt).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50/80 transition">
                            <td class="px-6 py-4">
                                <div class="font-semibold text-gray-900">${borrow.project_name || '-'}</div>
                                <div class="text-xs text-gray-500 mt-0.5">วัตถุประสงค์: ${borrow.purpose || '-'}</div>
                                ${createdAt ? `<div class="text-[11px] text-gray-400 mt-1"><i class="fa-regular fa-clock"></i> ทำรายการเมื่อ: ${createdAt}</div>` : ''}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-medium text-gray-900">${user.full_name}</div>
                                <div class="text-xs text-gray-500">รหัส: ${user.identifier_code}</div>
                            </td>
                            <td class="px-6 py-4">${itemsHtml}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-xs text-gray-600">
                                <div class="font-medium text-emerald-700"><i class="fa-regular fa-calendar-check"></i> ยืม: ${borrowDate}</div>
                                <div class="mt-1 text-rose-700"><i class="fa-regular fa-calendar-xmark"></i> คืน: ${dueDate}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">${statusBadge}</td>
                        </tr>
                    `;
                });

            } catch (err) {
                console.error('Error loading my requests:', err);
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-rose-600 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาตรวจสอบการเชื่อมต่อเซิร์ฟเวอร์ Backend (Port 3000)</td></tr>`;
            }
        }
    </script>
</body>
</html>
