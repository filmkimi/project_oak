<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ระบบจัดการยืม-คืนอุปกรณ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- นำเข้า Socket.io Client Library -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen relative">

    <!-- กล่องแจ้งเตือน Toast แบบ Real-time (มุมขวาบน) -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Header -->
    <header class="bg-slate-800 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-boxes-packing"></i> แดชบอร์ดผู้ดูแลระบบ (Admin Panel)
            </h1>
            <div class="flex items-center gap-3">
                <span id="socket-status" class="flex items-center gap-1.5 text-xs bg-slate-700 px-3 py-1 rounded-full text-gray-300">
                    <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> กำลังเชื่อมต่อ...
                </span>
                <span class="text-xs bg-slate-700 px-3 py-1 rounded-full">ผู้ดูแล: พัสดุและคลังกลาง</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-6 py-8">
        
        <!-- ตัวกรองข้อมูล -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex gap-4 items-center flex-wrap">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">กรองตามประเภทผู้ใช้:</label>
                    <select id="filterRole" onchange="loadAdminData()" class="border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500">
                        <option value="">ทั้งหมด (นักศึกษาและอาจารย์)</option>
                        <option value="student">นักศึกษา</option>
                        <option value="teacher">อาจารย์</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">กรองตามสถานะ:</label>
                    <select id="filterStatus" onchange="loadAdminData()" class="border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500">
                        <option value="">ทุกสถานะ</option>
                        <option value="pending">รออนุมัติ (Pending)</option>
                        <option value="approved">กำลังยืม (Approved)</option>
                        <option value="returned">คืนแล้ว (Returned)</option>
                    </select>
                </div>
            </div>
            <button onclick="loadAdminData()" class="bg-slate-800 text-white px-4 py-2 rounded-md text-sm hover:bg-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> โหลดข้อมูลใหม่
            </button>
        </div>

        <!-- ตารางข้อมูล -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ผู้ยืม / รหัส</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">โปรเจกต์ / วัตถุประสงค์</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">อุปกรณ์ที่ยืม (ชื่อ / รหัส / จำนวน)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">วันที่ยืม - กำหนดคืน</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">สถานะ</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- โหลดข้อมูลด้วย JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SOCKET_SERVER_URL = 'http://localhost:3000';
        const API_BASE_URL = 'http://localhost:3000/api';

        // ---------------- 1. การเชื่อมต่อ Socket.io ----------------
        const socket = io(SOCKET_SERVER_URL);
        const socketStatusEl = document.getElementById('socket-status');

        socket.on('connect', () => {
            console.log('✅ เชื่อมต่อ WebSocket เรียบร้อย ID:', socket.id);
            if (socketStatusEl) {
                socketStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ระบบ Real-time พร้อมใช้งาน`;
                socketStatusEl.classList.replace('text-gray-300', 'text-emerald-300');
            }
        });

        socket.on('disconnect', () => {
            console.log('⚠️ หลุดการเชื่อมต่อจาก WebSocket Server');
            if (socketStatusEl) {
                socketStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> ตัดการเชื่อมต่อ`;
                socketStatusEl.classList.replace('text-emerald-300', 'text-rose-300');
            }
        });

        // ดักฟังสัญญาณเมื่อมีคำขอยืมใหม่ส่งเข้ามา
        socket.on('new_borrow_request', (newBorrow) => {
            console.log('⚡ ได้รับคำขอยืมใหม่ผ่าน Socket:', newBorrow);
            showToast(`มีคำขอยืมใหม่จาก: ${newBorrow.user?.full_name || 'ผู้ใช้งาน'}`);
            // โหลดข้อมูลใหม่ทั้งหมดเพื่อเรียงลำดับและตรงกับตัวกรองที่เลือกอยู่
            loadAdminData();
        });

        // ดักฟังสัญญาณเมื่อสถานะถูกเปลี่ยน
        socket.on('request_status_changed', (data) => {
            console.log('⚡ สถานะคำขอเปลี่ยน:', data);
            loadAdminData();
        });

        // ---------------- 2. โหลดและแสดงผลข้อมูล ----------------
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminData();
        });

        async function loadAdminData() {
            const role = document.getElementById('filterRole').value;
            const status = document.getElementById('filterStatus').value;

            // ชี้ไปยัง Endpoint ของ borrowRoutes หรือ adminRoutes ตามที่คุณตั้งไว้
            let url = `${API_BASE_URL}/borrows?`;
            if (role) url += `role=${role}&`;
            if (status) url += `status=${status}&`;

            try {
                const res = await fetch(url);
                const result = await res.json();
                
                // รองรับทั้งกรณี Backend ส่ง Array ตรงๆ หรือห่อด้วย { success, data }
                const borrowList = Array.isArray(result) ? result : (result.data || []);
                renderTable(borrowList);
            } catch (err) {
                console.error('Error fetching data:', err);
            }
        }

        function renderTable(borrows) {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            if (!borrows || borrows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">ไม่พบข้อมูลการยืม-คืน</td></tr>`;
                return;
            }

            borrows.forEach(borrow => {
                const user = borrow.user || { full_name: 'ไม่พบข้อมูล', identifier_code: '-', role: 'student' };
                let roleBadge = user.role === 'teacher'
                    ? '<span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded font-medium">อาจารย์</span>'
                    : '<span class="bg-purple-100 text-purple-800 text-xs px-2 py-0.5 rounded font-medium">นักศึกษา</span>';

                let itemsHtml = (borrow.items || []).map(i => {
                    const itemName = i.item ? i.item.name : 'อุปกรณ์ถูกลบ';
                    const itemCode = i.item ? i.item.item_code : 'N/A';
                    return `<div class="text-sm">📦 <span class="font-medium">${itemName}</span> <span class="text-gray-400">(${itemCode})</span> x <b>${i.requested_qty}</b></div>`;
                }).join('');

                let statusBadge = '';
                if (borrow.status === 'pending') statusBadge = '<span class="bg-yellow-100 text-yellow-800 px-2.5 py-1 rounded text-xs font-semibold">รออนุมัติ</span>';
                else if (borrow.status === 'approved') statusBadge = '<span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded text-xs font-semibold">กำลังยืม</span>';
                else if (borrow.status === 'returned') statusBadge = '<span class="bg-green-100 text-green-800 px-2.5 py-1 rounded text-xs font-semibold">คืนแล้ว</span>';
                else statusBadge = `<span class="bg-gray-100 text-gray-800 px-2.5 py-1 rounded text-xs font-semibold">${borrow.status}</span>`;

                let actionBtn = '';
                if (borrow.status === 'pending') {
                    actionBtn = `<button onclick="approveRequest('${borrow._id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-medium hover:bg-emerald-700 transition">อนุมัติ</button>`;
                } else if (borrow.status === 'approved') {
                    actionBtn = `<button onclick="returnRequest('${borrow._id}', ${JSON.stringify(borrow.items).replace(/"/g, '&quot;')})" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-medium hover:bg-blue-700 transition">รับคืน</button>`;
                } else {
                    actionBtn = `<span class="text-gray-400 text-xs">เสร็จสิ้น</span>`;
                }

                const borrowDate = borrow.borrow_date ? new Date(borrow.borrow_date).toLocaleDateString('th-TH') : '-';
                const dueDate = borrow.due_date ? new Date(borrow.due_date).toLocaleDateString('th-TH') : '-';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition border-b">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="font-semibold text-gray-900">${user.full_name}</div>
                            <div class="text-xs text-gray-500">รหัส: ${user.identifier_code}</div>
                            <div class="mt-1">${roleBadge}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900">${borrow.project_name || '-'}</div>
                            <div class="text-xs text-gray-500">วัตถุประสงค์: ${borrow.purpose || '-'}</div>
                        </td>
                        <td class="px-6 py-4">${itemsHtml}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-xs text-gray-600">
                            ยืม: ${borrowDate}<br>
                            คืน: ${dueDate}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">${actionBtn}</td>
                    </tr>
                `;
            });
        }

        // ---------------- 3. ฟังก์ชันจัดการการอนุมัติและรับคืน ----------------
        async function approveRequest(id) {
            if (!confirm('ยืนยันการอนุมัติคำขอยืมรายการนี้?')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/borrows/${id}/approve`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: 'ADMIN001' })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('อนุมัติคำขอยืมสำเร็จ!');
                    loadAdminData();
                } else {
                    alert(data.error || 'เกิดข้อผิดพลาดในการอนุมัติ');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function returnRequest(id, items) {
            if (!confirm('ยืนยันการรับคืนอุปกรณ์ทั้งหมดในรายการนี้?')) return;
            
            // เตรียมรูปแบบ payload การคืนอุปกรณ์ตามที่ controller รองรับ
            const return_records = items.map(i => ({
                item_id: i.item?._id || i.item,
                returned_qty: i.requested_qty,
                damaged_qty: 0,
                lost_qty: 0
            }));

            try {
                const res = await fetch(`${API_BASE_URL}/borrows/${id}/return`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ return_records })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('บันทึกการรับคืนอุปกรณ์เรียบร้อยแล้ว');
                    loadAdminData();
                } else {
                    alert(data.error || 'เกิดข้อผิดพลาดในการรับคืน');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // แจ้งเตือน Toast Popup
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white text-sm px-4 py-3 rounded-lg shadow-lg border-l-4 border-emerald-500 flex items-center gap-2 transform transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-bell text-emerald-400"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
