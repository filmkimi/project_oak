<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ระบบจัดการยืม-คืนอุปกรณ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen relative">

    <!-- กล่องแจ้งเตือน Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Header -->
    <header class="bg-[#7a0c1e] text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-boxes-packing"></i> แดชบอร์ดผู้ดูแลระบบ (Admin Panel)
            </h1>
            <div class="flex items-center gap-3">
                <span id="socket-status" class="flex items-center gap-1.5 text-xs bg-[#5c0715] px-3 py-1 rounded-full text-gray-300">
                    <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> กำลังเชื่อมต่อ...
                </span>
                <span class="text-xs bg-[#5c0715] px-3 py-1 rounded-full">ผู้ดูแล: พัสดุและคลังกลาง</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-6 py-8 space-y-8">
        
        <!-- ส่วนที่ 1: คลังอุปกรณ์ทั้งหมด -->
        <section class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-box text-[#7a0c1e]"></i> คลังอุปกรณ์ทั้งหมด
                </h2>
                <button onclick="openAddModal()" class="bg-[#7a0c1e] text-white px-4 py-2 rounded-md text-sm hover:bg-[#5c0715] transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i> เพิ่มอุปกรณ์ใหม่
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">รูป / ชื่ออุปกรณ์</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">รหัสอุปกรณ์</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">หมวดหมู่</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">คงเหลือ / ทั้งหมด</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="items-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- โหลดรายการอุปกรณ์ด้วย JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- ส่วนที่ 2: รายการคำขอยืม-คืน -->
        <section class="bg-white p-6 rounded-lg shadow">
            <div class="flex flex-wrap gap-4 items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice text-[#7a0c1e]"></i> รายการคำขอยืม-คืนอุปกรณ์
                </h2>
                <div class="flex gap-3 items-center flex-wrap">
                    <select id="filterRole" onchange="loadAdminData()" class="border rounded-md px-3 py-1.5 text-sm">
                        <option value="">ทุกประเภทผู้ใช้</option>
                        <option value="student">นักศึกษา</option>
                        <option value="teacher">อาจารย์</option>
                    </select>
                    <select id="filterStatus" onchange="loadAdminData()" class="border rounded-md px-3 py-1.5 text-sm">
                        <option value="">ทุกสถานะ</option>
                        <option value="pending">รออนุมัติ</option>
                        <option value="approved">กำลังยืม</option>
                        <option value="returned">คืนแล้ว</option>
                    </select>
                    <button onclick="loadAdminData()" class="bg-[#7a0c1e] text-white px-3 py-1.5 rounded-md text-sm hover:bg-[#5c0715] transition">
                        <i class="fa-solid fa-rotate"></i> รีเฟรช
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ผู้ยืม</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">โปรเจกต์</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">อุปกรณ์ที่ยืม</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">วันที่ยืม</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">สถานะ</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- โหลดรายการยืม-คืนด้วย JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal: เพิ่มอุปกรณ์ใหม่ -->
    <div id="addItemModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-box-archive text-[#7a0c1e]"></i> เพิ่มอุปกรณ์เข้าคลัง
                </h3>
                <button type="button" onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="addItemForm" onsubmit="submitNewItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่ออุปกรณ์:</label>
                    <input type="text" id="itemName" required class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">รหัสอุปกรณ์ (Item Code):</label>
                    <input type="text" id="itemCode" required class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่:</label>
                    <select id="itemCategory" required class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500">
                        <option value="" disabled selected>เลือกหมวดหมู่</option>
                        <option value="durable">durable</option>
                        <option value="consumable">consumable</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">จำนวนทั้งหมด:</label>
                    <input type="number" id="itemQty" required min="1" value="1" class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ลิงก์รูปภาพ (Image URL):</label>
                    <input type="url" id="itemImage" class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500" placeholder="https://...">
                    <label for="itemImageFile" class="block text-xs font-semibold text-gray-600 mt-2 mb-1">หรือเลือกรูปจากเครื่อง (PNG/JPG ไม่เกิน 4 MB):</label>
                    <input type="file" id="itemImageFile" accept="image/png,image/jpeg" class="w-full text-sm text-gray-600 file:mr-3 file:rounded-md file:border-0 file:bg-gray-100 file:px-3 file:py-2">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeAddModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md text-sm">ยกเลิก</button>
                    <button type="submit" class="bg-[#7a0c1e] text-white px-5 py-2 rounded-md text-sm hover:bg-[#5c0715]">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: แก้ไขข้อมูลอุปกรณ์ -->
    <div id="editItemModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-600"></i> แก้ไขข้อมูลอุปกรณ์
                </h3>
                <button type="button" onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="editItemForm" onsubmit="submitEditItem(event)" class="space-y-4">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่ออุปกรณ์:</label>
                    <input type="text" id="editItemName" required class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">รหัสอุปกรณ์ (Item Code):</label>
                    <input type="text" id="editItemCode" required class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่:</label>
                    <select id="editItemCategory" required class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
                        <option value="" disabled selected>เลือกหมวดหมู่</option>
                        <option value="durable">durable</option>
                        <option value="consumable">consumable</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">จำนวนทั้งหมด:</label>
                    <input type="number" id="editItemQty" required min="1" class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ลิงก์รูปภาพ (Image URL):</label>
                    <input type="url" id="editItemImage" class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500" placeholder="https://...">
                    <label for="editItemImageFile" class="block text-xs font-semibold text-gray-600 mt-2 mb-1">หรือเลือกรูปใหม่จากเครื่อง (PNG/JPG ไม่เกิน 4 MB):</label>
                    <input type="file" id="editItemImageFile" accept="image/png,image/jpeg" class="w-full text-sm text-gray-600 file:mr-3 file:rounded-md file:border-0 file:bg-gray-100 file:px-3 file:py-2">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeEditModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md text-sm">ยกเลิก</button>
                    <button type="submit" class="bg-amber-600 text-white px-5 py-2 rounded-md text-sm hover:bg-amber-700">บันทึกการแก้ไข</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SOCKET_SERVER_URL = 'http://localhost:3000';
        const API_BASE_URL = 'http://localhost:3000/api';

        const socket = io(SOCKET_SERVER_URL);
        let adminItems = [];
        
        socket.on('connect', () => {
            const statusEl = document.getElementById('socket-status');
            if(statusEl) {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> พร้อมใช้งาน`;
            }
        });

        socket.on('item_updated', () => { loadItems(); });
        socket.on('borrow_updated', () => { loadAdminData(); });
        socket.on('new_borrow_request', () => { loadAdminData(); });
        socket.on('request_status_changed', () => { loadAdminData(); });

        document.addEventListener('DOMContentLoaded', () => {
            loadItems();
            loadAdminData();
        });

        // ---------------- โหลดรายการอุปกรณ์ ----------------
        async function loadItems() {
            try {
                const res = await fetch(`${API_BASE_URL}/items`);
                const items = await res.json();
                adminItems = Array.isArray(items) ? items : [];
                const tbody = document.getElementById('items-table-body');
                tbody.innerHTML = '';

                if (adminItems.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-gray-500">ไม่มีข้อมูลอุปกรณ์ในคลัง</td></tr>`;
                    return;
                }

                adminItems.forEach(item => {
                    const imgSrc = item.image_url || item.image || 'https://placehold.co/50x50?text=No+Image';
                    const availableQty = item.available_qty !== undefined && item.available_qty !== null
                        ? item.available_qty
                        : item.total_qty || 0;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition border-b">
                            <td class="px-4 py-3 flex items-center gap-3">
                                <img src="${imgSrc}" class="w-10 h-10 object-cover rounded border" onerror="this.src='https://placehold.co/50x50?text=Error'">
                                <span class="font-semibold text-gray-900">${item.name}</span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600">${item.item_code}</td>
                            <td class="px-4 py-3 text-sm text-gray-600">${item.category || '-'}</td>
                            <td class="px-4 py-3 text-sm font-medium text-gray-900">
                                ${availableQty} <span class="text-gray-400 font-normal">/ ${item.total_qty}</span>
                            </td>
                            <td class="px-4 py-3 text-center whitespace-nowrap">
                                <button type="button" onclick="openEditModal('${item._id}')"
                                    class="bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-medium hover:bg-amber-600 transition shadow-sm">
                                    <i class="fa-solid fa-pen-to-square"></i> แก้ไข
                                </button>
                                <button type="button" onclick="deleteItem('${item._id}')"
                                    class="bg-rose-600 text-white px-3 py-1.5 rounded text-xs font-medium hover:bg-rose-700 transition shadow-sm ml-1">
                                    <i class="fa-solid fa-trash"></i> ลบ
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error loading items:', err);
            }
        }

        // ---------------- เพิ่มอุปกรณ์ใหม่ ----------------
        function openAddModal() { document.getElementById('addItemModal').classList.remove('hidden'); }
        function closeAddModal() { 
            document.getElementById('addItemModal').classList.add('hidden'); 
            document.getElementById('addItemForm').reset(); 
        }

        function readImageValue(urlInputId, fileInputId) {
            const file = document.getElementById(fileInputId).files[0];
            if (!file) return Promise.resolve(document.getElementById(urlInputId).value.trim());

            const allowedTypes = ['image/png', 'image/jpeg'];
            if (!allowedTypes.includes(file.type)) {
                return Promise.reject(new Error('รองรับเฉพาะไฟล์ PNG หรือ JPG'));
            }
            if (file.size > 4 * 1024 * 1024) {
                return Promise.reject(new Error('ขนาดรูปต้องไม่เกิน 4 MB'));
            }

            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('อ่านไฟล์รูปไม่สำเร็จ กรุณาลองเลือกไฟล์ใหม่'));
                reader.readAsDataURL(file);
            });
        }

        async function submitNewItem(event) {
            if (event) event.preventDefault();

            try {
                const bodyData = {
                    name: document.getElementById('itemName').value.trim(),
                    item_code: document.getElementById('itemCode').value.trim(),
                    category: document.getElementById('itemCategory').value.trim(),
                    total_qty: parseInt(document.getElementById('itemQty').value) || 1,
                    image_url: await readImageValue('itemImage', 'itemImageFile')
                };
                const res = await fetch(`${API_BASE_URL}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();

                if (res.ok) {
                    showToast('เพิ่มอุปกรณ์ใหม่สำเร็จ!');
                    closeAddModal();
                    loadItems();
                } else {
                    alert(data.error || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                }
            } catch (err) {
                console.error('Network Error:', err);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
            }
        }

        async function deleteItem(id) {
            if (!confirm('ต้องการลบอุปกรณ์นี้ใช่หรือไม่? รายการจะถูกนำออกจากหน้าแรกด้วย')) return;

            try {
                const res = await fetch(`${API_BASE_URL}/items/${id}`, { method: 'DELETE' });
                let data;
                try {
                    data = await res.json();
                } catch {
                    throw new Error(`เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ${res.status}) กรุณารีสตาร์ต backend ที่พอร์ต 3000`);
                }

                if (res.ok) {
                    showToast('ลบอุปกรณ์สำเร็จ');
                    loadItems();
                } else {
                    alert(data.error || `ลบอุปกรณ์ไม่สำเร็จ (HTTP ${res.status})`);
                }
            } catch (err) {
                console.error('Network Error:', err);
                alert(err instanceof TypeError
                    ? 'เชื่อมต่อ backend ไม่ได้ กรุณาตรวจสอบว่า backend กำลังรันที่พอร์ต 3000'
                    : err.message || 'เกิดข้อผิดพลาดในการลบอุปกรณ์');
            }
        }

        // ---------------- แก้ไขข้อมูลอุปกรณ์ ----------------
        function openEditModal(id) {
            const item = adminItems.find(entry => entry._id === id);
            if (!item) {
                alert('ไม่พบข้อมูลอุปกรณ์ กรุณารีเฟรชรายการแล้วลองอีกครั้ง');
                return;
            }

            document.getElementById('editItemId').value = id;
            document.getElementById('editItemName').value = item.name || '';
            document.getElementById('editItemCode').value = item.item_code || '';
            const normalizedCategory = item.category === 'ครุภัณฑ์' ? 'durable' :
                item.category === 'วัสดุสิ้นเปลือง' ? 'consumable' : item.category;
            document.getElementById('editItemCategory').value =
                (normalizedCategory === 'null' || normalizedCategory === 'undefined') ? '' : normalizedCategory;
            document.getElementById('editItemQty').value = item.total_qty;
            const image = item.image_url || item.image || '';
            document.getElementById('editItemImage').value = image.startsWith('data:') ? '' : image;
            document.getElementById('editItemModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editItemModal').classList.add('hidden');
            document.getElementById('editItemForm').reset();
        }

        async function submitEditItem(event) {
            if (event) event.preventDefault();

            const id = document.getElementById('editItemId').value;
            try {
                const bodyData = {
                    name: document.getElementById('editItemName').value.trim(),
                    item_code: document.getElementById('editItemCode').value.trim(),
                    category: document.getElementById('editItemCategory').value.trim(),
                    total_qty: parseInt(document.getElementById('editItemQty').value) || 1,
                    image_url: await readImageValue('editItemImage', 'editItemImageFile')
                };
                const res = await fetch(`${API_BASE_URL}/items/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();

                if (res.ok) {
                    showToast('อัปเดตข้อมูลอุปกรณ์สำเร็จ!');
                    closeEditModal();
                    loadItems();
                } else {
                    alert(data.error || 'เกิดข้อผิดพลาดในการแก้ไขข้อมูล');
                }
            } catch (err) {
                console.error('Network Error:', err);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
            }
        }

        // ---------------- โหลดรายการยืม-คืน ----------------
        async function loadAdminData() {
            const role = document.getElementById('filterRole').value;
            const status = document.getElementById('filterStatus').value;
            const params = new URLSearchParams();
            if (role) params.set('role', role);
            if (status) params.set('status', status);
            const url = `${API_BASE_URL}/borrows?${params.toString()}`;

            try {
                const res = await fetch(url);
                const result = await res.json();
                const borrows = Array.isArray(result) ? result : (result.data || []);
                const tbody = document.getElementById('admin-table-body');
                tbody.innerHTML = '';

                if (borrows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-gray-500">ไม่พบข้อมูลการยืม</td></tr>`;
                    return;
                }

                borrows.forEach(b => {
                    const user = b.user || {};
                    const itemsText = (b.items || []).map(i => `${i.item?.name || 'อุปกรณ์'} (x${i.requested_qty})`).join(', ');
                    
                    let statusBadge = '';
                    if (b.status === 'pending') {
                        statusBadge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-yellow-100 text-yellow-800">รออนุมัติ</span>`;
                    } else if (b.status === 'approved' || b.status === 'borrowing') {
                        statusBadge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-800">กำลังยืม</span>`;
                    } else if (b.status === 'returned') {
                        statusBadge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-emerald-100 text-emerald-800">คืนแล้ว</span>`;
                    } else {
                        statusBadge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-gray-100 text-gray-800">${b.status}</span>`;
                    }

                    let actionButtons = '';
                    const borrowId = b._id || b.id;
                    if (b.status === 'pending') {
                        actionButtons = `
                            <div class="flex justify-center gap-1.5">
                                <button onclick="updateBorrowStatus('${borrowId}', 'approved')" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs hover:bg-emerald-700 transition" title="อนุมัติ">
                                    <i class="fa-solid fa-check"></i> อนุมัติ
                                </button>
                                <button onclick="updateBorrowStatus('${borrowId}', 'rejected')" class="bg-rose-600 text-white px-2.5 py-1 rounded text-xs hover:bg-rose-700 transition" title="ปฏิเสธ">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;
                    } else if (b.status === 'approved' || b.status === 'borrowing') {
                        actionButtons = `
                            <button onclick="updateBorrowStatus('${borrowId}', 'returned')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 transition" title="บันทึกรับคืน">
                                <i class="fa-solid fa-rotate-left"></i> รับคืน
                            </button>
                        `;
                    } else {
                        actionButtons = `<span class="text-xs text-gray-400">เสร็จสิ้น</span>`;
                    }

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="px-4 py-3 text-sm">${user.full_name || '-'}<br><span class="text-xs text-gray-400">${user.identifier_code || ''}</span></td>
                            <td class="px-4 py-3 text-sm">${b.project_name || '-'}</td>
                            <td class="px-4 py-3 text-sm">${itemsText}</td>
                            <td class="px-4 py-3 text-xs text-gray-600">${new Date(b.borrow_date).toLocaleDateString('th-TH')}</td>
                            <td class="px-4 py-3 text-sm">${statusBadge}</td>
                            <td class="px-4 py-3 text-center">${actionButtons}</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function updateBorrowStatus(id, newStatus) {
            if (!confirm(`คุณต้องการเปลี่ยนสถานะรายการนี้เป็น "${newStatus}" ใช่หรือไม่?`)) return;

            try {
                const res = await fetch(`${API_BASE_URL}/borrows/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                let data;
                try {
                    data = await res.json();
                } catch {
                    throw new Error(`เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ${res.status}) กรุณารีสตาร์ต backend`);
                }

                if (res.ok) {
                    showToast('อัปเดตสถานะสำเร็จ!');
                    loadAdminData();
                    loadItems(); 
                } else {
                    alert(data.error || data.message || `อัปเดตสถานะไม่สำเร็จ (HTTP ${res.status})`);
                }
            } catch (err) {
                console.error('Network Error:', err);
                alert(err instanceof TypeError
                    ? 'เชื่อมต่อ backend ไม่ได้ กรุณาตรวจสอบว่า backend กำลังรันที่พอร์ต 3000'
                    : err.message || 'เกิดข้อผิดพลาดในการอัปเดตสถานะ');
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-[#5c0715] text-white text-sm px-4 py-3 rounded-lg shadow-lg border-l-4 border-emerald-500';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
